name: Sonstiges Feedback
description: Rückmeldung, die weder Fehler noch Funktionswunsch ist.
title: "[Feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Danke für dein Feedback. HeinrichOS überträgt keine Daten automatisch. Bitte teile hier keine persönlichen oder vertraulichen Informationen.
        Wenn du fertig bist, klicke unten auf `Create`, um deine Meldung abzusenden.
  - type: input
    id: version
    attributes:
      label: HeinrichOS-Version
      placeholder: "z. B. Players Edition V1.6"
      value: "Players Edition V1.6"
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Deine Nachricht
      description: Schreibe hier deine Rückmeldung.
    validations:
      required: true
