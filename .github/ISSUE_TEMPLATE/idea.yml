name: Idee / Wunsch
description: Verbesserung, neue Funktion oder Wunsch für HeinrichOS.
title: "[Idee] "
body:
  - type: markdown
    attributes:
      value: |
        Danke für deine Idee. HeinrichOS überträgt keine Daten automatisch. Bitte teile hier keine persönlichen oder vertraulichen Informationen.
        Wenn du fertig bist, klicke unten auf `Create`, um deine Meldung abzusenden.
  - type: input
    id: version
    attributes:
      label: HeinrichOS-Version
      placeholder: "z. B. Players Edition V1.6"
      value: "Players Edition V1.6"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Was wünschst du dir?
      description: Beschreibe deine Idee oder Verbesserung.
      placeholder: "Ich würde mir wünschen, dass ..."
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Warum wäre das hilfreich?
      description: Optional – was würde dadurch für dich besser werden?
    validations:
      required: false
